<div class="card card-custom p-4">
    <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
        <i data-lucide="bell-ring" class="text-teal" style="width: 20px; height: 20px;"></i>
        Campus Notices
    </h5>
    <div class="row g-3">
        {% for a in announcements %}
            <div class="col-md-6 col-lg-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="badge bg-light text-dark border" style="font-size: 0.65rem;">{{ a.get_category_display }}</span>
                    <small class="text-muted" style="font-size: 0.7rem;">{{ a.created_at|date:"M d" }}</small>
                </div>
                <h6 class="fw-bold mb-1" style="font-size: 0.85rem;">{{ a.title }}</h6>
                <p class="text-secondary mb-0" style="font-size: 0.78rem; line-height: 1.3;">{{ a.content|truncatewords:15 }}</p>
            </div>
        {% empty %}
            <div class="col-12"><p class="text-muted small mb-0">No active announcements at this time.</p></div>
        {% endfor %}
    </div>
</div>
