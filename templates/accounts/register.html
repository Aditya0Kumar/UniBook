{% extends "base.html" %}

{% block title %}Create Account | UniBook{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card card-custom p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="mx-auto mb-2 p-3 rounded-circle d-flex align-items-center justify-content-center bg-light" style="width: 56px; height: 56px;">
                        <i data-lucide="user-plus" class="text-primary" style="width: 28px; height: 28px;"></i>
                    </div>
                    <h3 class="fw-bold">Join UniBook</h3>
                    <p class="text-muted small">Register with your university profile to unlock instant campus facility reservations.</p>
                </div>

                <form method="POST" action="{% url 'accounts:register' %}">
                    {% csrf_token %}
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Username *</label>
                            <input type="text" name="username" class="form-control form-control-sm" placeholder="e.g. john_doe" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Campus Email *</label>
                            <input type="email" name="email" class="form-control form-control-sm" placeholder="name@campus.edu" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">First Name</label>
                            <input type="text" name="first_name" class="form-control form-control-sm" placeholder="Alex">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Last Name</label>
                            <input type="text" name="last_name" class="form-control form-control-sm" placeholder="Smith">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Campus Role *</label>
                            <select name="role" class="form-select form-select-sm" required>
                                <option value="student" selected>Student</option>
                                <option value="faculty">Faculty Member</option>
                                <option value="facility_manager">Facility Manager / Staff</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">University ID / Roll Number</label>
                            <input type="text" name="university_id" class="form-control form-control-sm" placeholder="e.g. CS-2026-089">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Academic Department</label>
                            <select name="department" class="form-select form-select-sm">
                                <option value="">Select Department (Optional)</option>
                                {% for d in departments %}
                                    <option value="{{ d.id }}">{{ d.name }} ({{ d.code }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                            <input type="tel" name="phone_number" class="form-control form-control-sm" placeholder="+91 98765 43210">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Password *</label>
                            <input type="password" name="password" class="form-control form-control-sm" placeholder="At least 6 characters" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Confirm Password *</label>
                            <input type="password" name="confirm_password" class="form-control form-control-sm" placeholder="Repeat password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-unibook-primary py-2 fw-semibold">Register Profile</button>
                    </div>

                    <div class="text-center text-muted small">
                        Already have an account?
                        <a href="{% url 'accounts:login' %}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
