{% extends "base.html" %}

{% block title %}Sign In | UniBook{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5 shadow-sm" style="border-radius: 24px;">
                <div class="text-center mb-4">
                    <div class="brand-icon-box mx-auto mb-3" style="width: 44px; height: 44px; border-radius: 12px;">
                        <i data-lucide="book-open" style="width: 22px; height: 22px;"></i>
                    </div>
                    <h3 class="fw-extrabold" style="color: #181C32; font-weight: 800;">Sign In to UniBook</h3>
                    <p class="text-muted small">Enter your university credentials to manage your facility reservations.</p>
                </div>

                <form method="POST" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Username or Campus Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i data-lucide="user" style="width: 16px; height: 16px;"></i></span>
                            <input type="text" name="username" id="loginUsername" class="form-control rounded-end-3" placeholder="e.g. student_demo or alex@campus.edu" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold text-secondary mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i data-lucide="key" style="width: 16px; height: 16px;"></i></span>
                            <input type="password" name="password" id="loginPassword" class="form-control rounded-end-3" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-unibook-dark py-2 rounded-pill fw-semibold">Sign In</button>
                    </div>
                </form>

                <!-- Quick Demo Login Buttons for Evaluator / Testing -->
                <div class="p-3 bg-light rounded-4 border mt-2">
                    <div class="small fw-bold text-secondary mb-2 text-center">One-Click Demo Credentials:</div>
                    <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="setDemo('student_demo', 'StudentPass123!')">Student</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="setDemo('faculty_demo', 'FacultyPass123!')">Faculty</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="setDemo('manager_demo', 'ManagerPass123!')">Manager</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="setDemo('admin', 'AdminPass123!')">Super Admin</button>
                    </div>
                </div>

                <div class="text-center mt-4 text-muted small">
                    Don't have an account yet?
                    <a href="{% url 'accounts:register' %}" class="fw-semibold text-decoration-none" style="color: #3B52D4;">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function setDemo(username, password) {
        document.getElementById('loginUsername').value = username;
        document.getElementById('loginPassword').value = password;
    }
</script>
{% endblock %}
